<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The Funny GIS — an Earth with eyes. Three solid colours:
       ocean #0079C1, land #4FB0EA, white #FFFFFF. -->
  <defs>
    <clipPath id="earth"><circle cx="64" cy="64" r="58"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="58" fill="#0079C1"/>
  <g clip-path="url(#earth)" fill="#4FB0EA">
    <!-- the Americas -->
    <path d="M14 30c10-8 24-10 32-4 6 5 2 12 6 18 3 5 10 6 9 13-1 8-11 9-14 16-3 8 4 15 0 24-3 7-10 10-14 6-5-6-1-15-6-22-5-6-14-8-16-17-2-10 2-26 3-34Z"/>
    <!-- Africa / Europe -->
    <path d="M78 14c9-3 22 0 30 8 6 6 9 15 4 20-4 4-11 1-15 6-3 4 1 10-2 16-4 7-3 16-8 22-4 5-11 4-13-3-2-8 3-17 0-25-2-6-10-8-11-15-1-9 6-25 15-29Z"/>
    <!-- Asia-Pacific islands -->
    <path d="M100 86c6-2 13 1 15 6 1 5-4 9-10 9s-11-3-11-8c0-3 2-6 6-7Z"/>
  </g>
  <!-- eyes -->
  <ellipse cx="48" cy="56" rx="11" ry="13" fill="#FFFFFF"/>
  <ellipse cx="80" cy="56" rx="11" ry="13" fill="#FFFFFF"/>
  <circle cx="51" cy="59" r="5.5" fill="#0079C1"/>
  <circle cx="83" cy="59" r="5.5" fill="#0079C1"/>
  <circle cx="53" cy="57" r="1.8" fill="#FFFFFF"/>
  <circle cx="85" cy="57" r="1.8" fill="#FFFFFF"/>
  <!-- smile -->
  <path d="M52 84c7 7 17 7 24 0" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- rim -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#FFFFFF" stroke-width="0"/>
</svg>
